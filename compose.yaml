# Local Postgres for development and integration tests. Start it with
# `just db-up`; the password comes from .env (see .env.example).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cowbook
      POSTGRES_DB: cowbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # From Postgres 18 the image keeps its data under /var/lib/postgresql,
      # in a directory per major version, not in /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowbook -d cowbook"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
